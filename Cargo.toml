[package]
name = "steam-calendar"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
# Calendar related
icalendar = "0.16"
chrono = "0.4"
chrono-tz = "0.10"

# Utils
dotenv = "0.15"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
